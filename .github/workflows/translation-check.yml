name: Translation Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate translation keys
        run: |
          node -e "$(cat <<'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          /**
           * Recursively collect all files with given extensions under a directory.
           */
          function getSourceFiles(dir, extensions) {
            let results = [];
            const list = fs.readdirSync(dir, { withFileTypes: true });
            for (const item of list) {
              const fullPath = path.join(dir, item.name);
              if (item.isDirectory()) {
                results = results.concat(getSourceFiles(fullPath, extensions));
              } else if (extensions.includes(path.extname(item.name))) {
                results.push(fullPath);
              }
            }
            return results;
          }

          /**
           * Extract i18n keys from file content.
           * Matches t('key') and t("key") where the key starts with 'panel.'.
           */
          function extractKeys(content) {
            // Matches t('…'), t("…"), t(`…`)  — the captured group is the key
            const regex = /t\(['"`]([^'"`]+)['"`][^)]*\)/g;
            const keys = [];
            let match;
            while ((match = regex.exec(content)) !== null) {
                if (match[1]?.startsWith('panel.')) {
                keys.push(match[1]);
                }
            }
            return keys;
          }

          /**
           * Check if a dot-separated path exists inside a nested object.
           */
          function checkKeyInJSON(obj, keyPath) {
            const parts = keyPath.split('.');
            let current = obj;
            for (const part of parts) {
              if (current && typeof current === 'object' && part in current) {
                current = current[part];
              } else {
                return false;
              }
            }
            return true;
          }

          // ---------------------------------------------------------------
          const sourceDir = 'src';
          const localeDir = 'src/locales';
          const localeFiles = fs.readdirSync(localeDir, { withFileTypes: true })
            .filter(dirent => dirent.isDirectory())
            .map(dirent => path.join(localeDir, dirent.name, 'tim012432-calendarheatmap-panel.json'))
            .filter(fs.existsSync);

          // Gather all source files
          const extensions = ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'];
          const sourceFiles = getSourceFiles(sourceDir, extensions);

          // Extract unique keys starting with 'panel.'
          const allKeys = new Set();
          for (const file of sourceFiles) {
            const content = fs.readFileSync(file, 'utf8');
            const keys = extractKeys(content);
            keys.forEach(k => allKeys.add(k));
          }

          if (allKeys.size === 0) {
            console.log('No translatable keys found in source files.');
            process.exit(0);
          }

          // Check each locale file
          const missing = {};
          for (const lf of localeFiles) {
            if (!fs.existsSync(lf)) {
              console.error(`::error::Locale file not found: ${lf}`);
              process.exit(1);
            }
            const localeData = JSON.parse(fs.readFileSync(lf, 'utf8'));
            const lfRelative = path.relative(process.cwd(), lf);
            const missingKeys = [];
            for (const key of allKeys) {
              if (!checkKeyInJSON(localeData, key)) {
                missingKeys.push(key);
              }
            }
            if (missingKeys.length > 0) {
              missing[lfRelative] = missingKeys;
            }
          }

          if (Object.keys(missing).length > 0) {
            console.error('::error::Missing translations detected:');
            for (const [file, keys] of Object.entries(missing)) {
              console.error(`\nIn ${file}:`);
              keys.forEach(k => console.error(`  - ${k}`));
            }
            process.exit(1);
          }

          console.log('All translation keys are present in every locale file.');
          SCRIPT
          )"
        shell: bash
