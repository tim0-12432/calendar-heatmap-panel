minimumReleaseAge: 20160
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'
  - 'ua-parser-js@1.0.41'
registries:
  default: https://registry.npmjs.org/
blockExoticSubdeps: false # because of react-data-grid
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
overrides:
  'nanoid@3.3.16': '3.3.18'
  'js-yaml@4.3.0': '4.3.1'
  'js-yaml@3.15.0': '3.15.1'
  'fast-uri@3.1.4': '3.1.5'
  'immutable@5.1.4': '5.1.9'
  'js-cookie@2.2.1': '3.0.8' # weird jump, but necessary because of old react-use
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - js-yaml@3.15.1 || 4.3.1
  - fast-uri@3.1.5
